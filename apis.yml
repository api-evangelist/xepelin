aid: xepelin
name: Xepelin
description: Xepelin is a Chilean-founded fintech operating in Chile and Mexico that
  provides digital financial services for small and mid-sized businesses, including
  invoice factoring (adelanto de facturas), supplier payment financing (confirming),
  working capital credit lines, and collections and payments management, alongside
  XData, a financial-intelligence product for evaluating clients and suppliers. The
  company reports more than 60,000 business customers and over five billion USD financed
  in the last three years, with digital credit approval in under 24 hours. Xepelin
  does not currently publish a public developer API, developer portal, or API documentation.
